[launcher]
# 游戏页面地址（缺少 http:// 会自动补全）
gameUrl=http://v5.t.imop.com/

# 启动即全屏（无边框覆盖整个屏幕，含任务栏）；与 startFitToWorkArea 二选一，startFullScreen 优先
startFullScreen=false
# 启动即填满屏幕工作区（不遮挡任务栏）
startFitToWorkArea=true

# 窗口初始宽度/高度（像素）
width=1280
height=720

# 浏览器视口模式：fill=填满窗口；fixed=固定尺寸（按下面 browserWidth/Height）
browserViewportMode=fixed
# fixed 模式下的视口尺寸；同时用于把 Flash 元素（#flashcontent）钉到该大小
browserWidth=1005
browserHeight=600
# fixed 模式下的对齐方式：topLeft=左上角；center=居中
browserAlign=topLeft

# 强制把 Flash 元素（#flashcontent）钉在左上角、去边距、黑底
fixFlashPosition=true
# 窗口是否始终置顶
topMost=false
# 是否抑制脚本错误弹窗
scriptErrorsSuppressed=true

# 定时解除鼠标裁剪，防止游戏把鼠标锁死在窗口内
releaseMouseClip=true
# 鼠标裁剪释放 / 顶部跳跃防护的轮询间隔（毫秒，10~1000）
mouseClipPollIntervalMs=30

# 是否启用鼠标诊断采样（写入 logs/mouse-diagnostics.log）
mouseDiagnosticsEnabled=true
# 鼠标诊断采样间隔（毫秒）
mouseDiagnosticsIntervalMs=1000

# 是否启用“鼠标顶部跳跃”防护（Flash 全屏/焦点切换导致光标异常上跳时拉回）
mouseTopJumpGuardEnabled=false
# 触发顶部跳跃防护的向上位移阈值（像素）
mouseTopJumpThresholdPixels=120
# 纠正后鼠标回落到 Flash 区域顶部的偏移（像素）
mouseTopJumpReturnOffsetPixels=8

# 单个日志文件达到此大小（MB）后自动轮转（1~200），保留一份 .1 备份，避免长期运行撑满磁盘
maxLogSizeMB=10
